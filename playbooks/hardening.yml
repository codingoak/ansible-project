---
###############################################################
# RHEL 10.1 – Complete CIS L2 Hardening Playbook
# Purpose: CIS L2 Server Hardening
# Access: SSH key-only from Control Node
#
# OpenSCAP target: CIS RHEL 10 Benchmark L2 – Server (v1.0.1)
#
# All tasks live in roles/cis_hardening, split by CIS section.
# Defaults: roles/cis_hardening/defaults/main.yml
#
# Usage:
#   ansible-playbook playbooks/hardening.yml --check --diff
#   ansible-playbook playbooks/hardening.yml
#   ansible-playbook playbooks/hardening.yml --tags ssh,sysctl
#
# WARNING: Always test in a non-production environment first!
# WARNING: Keep a second SSH session open when applying SSH changes!
###############################################################

- name: RHEL 10.1 CIS L2 Complete Hardening
  hosts: managed
  become: true

  vars:
    # CHANGE: IP of the control node (only host allowed to SSH in)
    control_node_ip: "192.168.x.x"

  roles:
    - role: cis_hardening
