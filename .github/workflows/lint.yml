---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core and ansible-lint
        run: pip install ansible-core ansible-lint

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: |
          # Inventory example is enough for a syntax check
          ansible-playbook --syntax-check -i inventory/hosts.ini.example playbooks/hardening.yml playbooks/hello.yml

      - name: Run ansible-lint (production profile)
        run: ansible-lint
