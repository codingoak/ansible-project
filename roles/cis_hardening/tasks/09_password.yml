---
# ═══════════════════════════════════════════════════
#  BLOCK 09: PASSWORD QUALITY REQUIREMENTS
# ═══════════════════════════════════════════════════

- name: "[09] Install libpwquality"
  ansible.builtin.dnf:
    name: libpwquality
    state: present
  tags: [password]

- name: "[09] Set password complexity requirements"
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf
    backup: true
    owner: root
    group: root
    mode: "0644"
    content: |
      minlen = {{ password_min_length }}
      dcredit = -1
      ucredit = -1
      lcredit = -1
      ocredit = -1
      maxrepeat = 3
      maxsequence = 3
      difok = 2
      dictcheck = 1
      minclass = 4
      enforce_for_root
  tags: [password]

- name: "[09] Set PASS_MAX_DAYS in login.defs"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MAX_DAYS'
    line: "PASS_MAX_DAYS   {{ password_max_days }}"
  tags: [password]

- name: "[09] Set PASS_MIN_DAYS in login.defs"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MIN_DAYS'
    line: "PASS_MIN_DAYS   {{ password_min_days }}"
  tags: [password]

- name: "[09] Set PASS_WARN_AGE in login.defs"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_WARN_AGE'
    line: "PASS_WARN_AGE   {{ password_warn_days }}"
  tags: [password]

- name: "[09] Set inactivity lock for new accounts"
  ansible.builtin.shell: |
    set -o pipefail
    current=$(useradd -D | awk -F= '/^INACTIVE/ {print $2}')
    if [ "$current" != "{{ password_inactive_days }}" ]; then
      useradd -D -f {{ password_inactive_days }}
      echo "CHANGED"
    fi
  args:
    executable: /bin/bash
  register: useradd_inactive
  changed_when: "'CHANGED' in useradd_inactive.stdout"
  tags: [password]

- name: "[09] Apply PASS_MIN_DAYS to existing users"
  ansible.builtin.shell: |
    # Only touch users whose /etc/shadow field 4 differs
    for user in $(awk -F: '($3 >= 1000 && $1 != "nobody") {print $1}' /etc/passwd); do
      current=$(awk -F: -v u="$user" '$1 == u {print $4}' /etc/shadow)
      if [ "$current" != "{{ password_min_days }}" ]; then
        chage --mindays {{ password_min_days }} "$user"
        echo "CHANGED $user"
      fi
    done
  register: chage_min
  changed_when: "'CHANGED' in chage_min.stdout"
  tags: [password]

- name: "[09] Apply PASS_MAX_DAYS to existing users"
  ansible.builtin.shell: |
    # Only touch users whose /etc/shadow field 5 differs
    for user in $(awk -F: '($3 >= 1000 && $1 != "nobody") {print $1}' /etc/passwd); do
      current=$(awk -F: -v u="$user" '$1 == u {print $5}' /etc/shadow)
      if [ "$current" != "{{ password_max_days }}" ]; then
        chage --maxdays {{ password_max_days }} "$user"
        echo "CHANGED $user"
      fi
    done
  register: chage_max
  changed_when: "'CHANGED' in chage_max.stdout"
  tags: [password]

- name: "[09] Apply inactivity lock to existing users"
  ansible.builtin.shell: |
    # Only touch users whose /etc/shadow field 7 differs
    for user in $(awk -F: '($3 >= 1000 && $1 != "nobody") {print $1}' /etc/passwd); do
      current=$(awk -F: -v u="$user" '$1 == u {print $7}' /etc/shadow)
      if [ "$current" != "{{ password_inactive_days }}" ]; then
        chage --inactive {{ password_inactive_days }} "$user"
        echo "CHANGED $user"
      fi
    done
  register: chage_inactive
  changed_when: "'CHANGED' in chage_inactive.stdout"
  tags: [password]
